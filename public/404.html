<!doctype html>
<html lang="id">
<head>

  <link rel="icon" href="/icons/icon-32.png">

  <link rel="stylesheet" href="/shared/tokens.css">

    .nf { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
