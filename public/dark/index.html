<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B1925">
  <title>Kantong</title>
  <style>html, body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B1925; color: #F3F0FA; font: 600 16px system-ui, sans-serif; }</style>
</head>
<body>
  <p>Membuka Kantong (tema gelap)…</p>
  <script>
    // Varian /dark/ lama sudah digabung ke app utama: buka app utama dengan tema gelap.
    try { localStorage.setItem('k_theme', JSON.stringify('dark')); } catch (e) { /* abaikan */ }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { if (/\/dark\/$/.test(r.scope)) r.unregister(); });
      }).catch(function () {});
    }
    location.replace('../');
  </script>
</body>
</html>
